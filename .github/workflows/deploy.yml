# Deploys only when manually triggered from the Actions tab.
# This is intentionally NOT set to run on every push — the infrastructure
# code lives in this repo as a working reference, but nothing gets applied
# to a real Azure subscription unless someone deliberately runs it.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed for the OIDC token exchange with Azure

concurrency: deploy # never run two deploys at once

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  infrastructure:
    name: Terraform apply
    runs-on: ubuntu-latest
    outputs:
      function_app_name: ${{ steps.output.outputs.function_app_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init
        run: terraform -chdir=terraform init

      - name: Plan
        run: terraform -chdir=terraform plan -out=tfplan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_enable_function_app: ${{ vars.ENABLE_FUNCTION_APP || 'false' }}

      - name: Apply
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Read outputs
        id: output
        run: echo "function_app_name=$(terraform -chdir=terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"

  function:
    name: Deploy function code
    needs: infrastructure
    if: vars.ENABLE_FUNCTION_APP == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.infrastructure.outputs.function_app_name }}
          package: app
          scm-do-build-during-deployment: true
          enable-oryx-build: true
